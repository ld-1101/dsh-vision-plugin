# dsh-vision-plugin bundle patch（`dsh plugin add` 安装时自动激活）
#
# 两种安装方式：
#   A. dsh plugin add（推荐社区用户）：
#      dsh plugin --profile web add github:ld-1101/dsh-vision-plugin
#      本 patch 自动生效（insert dsh-vision-plugin 包），无需手动编辑。
#      安装后仍需执行 patch-host.ps1 打宿主补丁并重启。
#   B. 脚本安装（本仓库 install.ps1）：
#      install.ps1 会生成 profile 级 insert 条目（绝对路径指向 src/index.ts），
#      与本文件无关。

- insert:
    - id: dsh-vision
      name: dsh-vision-plugin
